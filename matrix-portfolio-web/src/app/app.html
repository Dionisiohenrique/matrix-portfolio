<div class="rain" aria-hidden="true">
  @for (col of rainColumns(); track $index) {
    <div class="rain-col" [style.animation-duration.ms]="4000 + ($index % 7) * 900">
      @for (ch of col; track $index) {<span>{{ ch }}</span>}
    </div>
  }
</div>
