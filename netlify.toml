[build]
  base = "matrix-portfolio-web"
  command = "npm run build"
  publish = "dist/matrix-portfolio-web/browser"

[[redirects]]
  # Proxy API calls to the Render backend (no CORS needed).
  from = "/api/*"
  to = "https://matrix-portfolio-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
